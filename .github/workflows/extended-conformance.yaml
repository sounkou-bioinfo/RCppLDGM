on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

name: Extended conformance

permissions: read-all

jobs:
  graphld-ldgm-conformance:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RCPP_LDGM_PYTHON: python
      RCPP_LDGM_REQUIRE_H5PY: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install SuiteSparse headers for upstream Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsuitesparse-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Install GraphLD/ldgm Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade networkx msprime tskit scipy polars pandas tqdm click h5py filelock numpy

      - name: Fetch pinned upstream GraphLD for reader/interop checks
        run: |
          mkdir -p .sync
          if [ ! -d .sync/graphld/.git ]; then
            git clone --filter=blob:none https://github.com/oclb/graphld.git .sync/graphld
          else
            git -C .sync/graphld fetch --depth 1
          fi
          git -C .sync/graphld checkout 823d92baf6178e1948bc10637064c4e29c6c6b62

      - name: Run upstream ldgm conformance gate
        run: |
          make upstream-python
          make upstream-ldgm-conformance

      - name: Run GraphLD data and reader conformance gates
        env:
          RCPP_LDGM_GRAPHLD_ROOT: ${{ github.workspace }}/.sync/graphld
          RCPP_LDGM_GRAPHLD_DATA: ${{ github.workspace }}/.sync/graphld/data/test
        run: |
          make upstream-graphld-smoke
          make upstream-graphld-reader-conformance
          make upstream-graphld-inverse-diagonal-conformance
          make upstream-graphld-blup-clump-conformance
          make upstream-graphld-reml-conformance
          make upstream-graphld-simulate-conformance

      - name: Run GraphLD HDF5 interop gate
        env:
          RCPP_LDGM_GRAPHLD_ROOT: ${{ github.workspace }}/.sync/graphld
        run: |
          make upstream-graphld-hdf5-interop